<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>Merchant Shop — KHQR Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://checkout.khqr.dev wss://checkout.khqr.dev https://checkout.bakongrelay.com wss://checkout.bakongrelay.com;">
    <!-- ⚡️ ភ្ជាប់ JS SDK ពី checkout.khqr.dev -->
    <script src="https://checkout.khqr.dev/static/js/checkout.min.js"></script>
</head>
<body style="background-color: #104e4e; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif;">

    <!-- ⚡️ ហៅប្រើប្រាស់ KHQR.pay(...) -->
    <button onclick="KHQR.pay('CeorJsbUCemw')" style="padding: 15px 30px; background: #0284c7; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        Checkout Now
    </button>

    <script>
        window.addEventListener('khqrPaymentSuccess', function(e) {
            console.log("Payment completed for:", e.detail.session_id);
        });
        window.addEventListener('bakongPaymentSuccess', function(e) {
            console.log("Payment completed for (legacy event):", e.detail.session_id);
        });
    </script>
</body>
</html>
