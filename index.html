<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>Khmer Handicraft Shop | ហាងសិប្បកម្មខ្មែរ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://checkout.bakongrelay.com wss://checkout.bakongrelay.com;">
    <script src="https://checkout.bakongrelay.com/static/js/checkout.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Google Sans', 'Noto Sans Khmer', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f1e9;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #1a3c34, #2e5c4d);
            color: white;
            padding: 25px 0;
            text-align: center;
        }
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .product {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .product-img {
            flex: 1;
            min-width: 300px;
        }
        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info {
            flex: 1;
            padding: 40px 30px;
            min-width: 300px;
        }
        h1 {
            color: #1a3c34;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .price {
            font-size: 28px;
            color: #d35400;
            font-weight: bold;
            margin: 15px 0;
        }
        button {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            background: #0b2447 !important;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            font-family: 'Google Sans', 'Noto Sans Khmer', system-ui, sans-serif;
        }
        button:hover {
            background: #1e3d6b;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h2>Khmer Handicraft Shop</h2>
        <p>សិប្បកម្មខ្មែរ គុណភាពខ្ពស់</p>
    </header>

    <div class="container">
        <div class="product">
            
            <!-- New Image -->
            <div class="product-img">
                <img src="https://i.etsystatic.com/10248981/r/il/53b5d8/6690036297/il_570xN.6690036297_7ncc.jpg" 
                     alt="ខ្សែកប្រាក់ខ្មែរ">
            </div>

            <div class="product-info">
                <h1>ខ្សែកប្រាក់សុទ្ធ លំនាំខ្មែរ</h1>
                <p>ធ្វើដោយដៃពីប្រាក់សុទ្ធ ៩៩៩</p>
                
                <div class="price">
                    ១២៥,០០០ រៀល 
                    <span style="text-decoration: line-through; color: #999; font-size: 18px;">១៥០,០០០ រៀល</span>
                </div>

                <div style="margin: 20px 0; color: #555;">
                    ខ្សែកប្រាក់សុទ្ធលំនាំអង្គរ រចនាដោយសិល្បករខ្មែរ។ 
                    ស័ក្តិសមសម្រាប់ជាអំណោយ ឬពាក់ប្រចាំថ្ងៃ។
                </div>

                <button id="payButton">
                    🛒 ទូទាត់ឥឡូវនេះ
                </button>
                
                <div id="status"></div>
            </div>
        </div>
    </div>

    <script>
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        const token = getUrlParameter('t') || getUrlParameter('token');
        const payButton = document.getElementById('payButton');
        const statusDiv = document.getElementById('status');

        if (token) {
            payButton.onclick = function() {
                statusDiv.innerHTML = "កំពុងបើកទំព័រ Checkout...";
                BakongRelay.pay(token);
            };
        } else {
            payButton.disabled = true;
            payButton.style.background = "#888";
            statusDiv.innerHTML = `<span style="color: #d35400;">⚠️ មិនមានលេខសម្ងាត់ t= នៅក្នុង URL</span>`;
        }

        window.addEventListener('bakongPaymentSuccess', function(e) {
            statusDiv.innerHTML = `✅ ទូទាត់ជោគជ័យ! អរគុណបង្អូន។`;
        });
    </script>
</body>
</html>
