<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>Test Merchant Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://checkout.bakongrelay.com/static/checkout.js"></script>
    
    <style>
        body { font-family: sans-serif; background-color: #104e4e; color: white; padding: 40px; text-align: center; }
        .card { background: white; color: #333; padding: 20px; border-radius: 12px; max-width: 500px; margin: 20px auto; }
        .btn { padding: 12px 24px; background: #0b2447; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .iframe-container { max-width: 900px; margin: 40px auto; background: white; padding: 10px; border-radius: 20px; }
        #log-box { background: #000; color: #00ff00; padding: 15px; border-radius: 8px; max-width: 600px; margin: 20px auto; text-align: left; font-family: monospace; }
    </style>
</head>
<body>

    <h1>Bakong Relay Integration Testing</h1>
    
    <div id="log-box">📬 Waiting for payment events...</div>

    <div class="card">
        <h3>ជម្រើសទី ១៖ តេស្តតាម SDK (Popup)</h3>
        <p>ចុចប៊ូតុងខាងក្រោមដើម្បីបើកផ្ទាំង Checkout តាមរយៈ SDK</p>
        <button class="btn" onclick="BakongRelay.pay('NY34aYwl-j8i')">
            Checkout with SDK
        </button>
    </div>

    <div class="iframe-container">
        <h3>ជម្រើសទី ២៖ តេស្តតាម iFrame Snippet (Embedded)</h3>
        <p>ខាងក្រោមនេះជាផ្ទាំងដែលកើតចេញពីការយក iFrame Snippet ពី API Response មកដាក់ផ្ទាល់</p>
        
        <iframe id="bakong-relay-iframe" src="https://checkout.bakongrelay.com/NY34aYwl-j8i" width="100%" height="650" allow="clipboard-write" style="border:none; border-radius:20px; box-shadow:0 4px 20px rgba(15,23,42,0.15);"></iframe>
        <script>
          window.addEventListener("message", function(event) {
            if (event.origin !== "https://checkout.bakongrelay.com") return;
            if (event.data && event.data.event === "payment_success") {
               var customEvent = new CustomEvent("bakongPaymentSuccess", { detail: event.data });
               window.dispatchEvent(customEvent);
            }
          });
        </script>
    </div>

    <script>
        window.addEventListener('bakongPaymentSuccess', function(e) {
            console.log("👉 ទិន្នន័យទទួលបាននៅលើ Web Merchant:", e.detail);
            
            // បង្ហាញទិន្នន័យនៅលើផ្ទាំងអេក្រង់ឱ្យបងបានឃើញច្បាស់ៗ
            const logBox = document.getElementById('log-box');
            logBox.innerHTML = `🎉 <b>ទូទាត់ជោគជ័យ (Payment Success)!</b><br><br>` + 
                               `📦 Payload: ` + JSON.stringify(e.detail, null, 2);
            
            // បើសិនជាប្រើ SDK Popup គឺយើងអាចបញ្ជាឱ្យវាបិទខ្លួនឯងភ្លាមៗក្រោយបង់លុយរួច
            if (window.BakongRelay && typeof window.BakongRelay.close === 'function') {
                setTimeout(function() {
                    window.BakongRelay.close();
                }, 3000); // ទុក ៣ វិនាទីឱ្យមើល Log រួចបិទ Popup
            }
        });
    </script>

</body>
</html>
